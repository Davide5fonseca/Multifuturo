# Serve o site numa subpasta: http://localhost/multifuturo
#
# O Sail serve a aplicação com "php artisan serve", que só sabe responder na
# raiz. Este nginx fica à frente e retira o prefixo /multifuturo do pedido antes
# de o entregar à aplicação. Do lado do Laravel, é o APP_URL (que já inclui a
# subpasta) que faz os links serem gerados com o prefixo — ver App\Support\AppUrl.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app {
    server multifuturo.test:80;
}

server {
    listen 80;
    server_name _;

    # Uploads do backoffice (fotografias e documentos).
    client_max_body_size 64m;

    # Quem entra na raiz vai para o site.
    location = / {
        return 302 /multifuturo/;
    }

    # O Livewire e o Filament pedem alguns endereços a partir da raiz
    # (/livewire/update, /livewire/upload-file, ...) porque os constroem como
    # caminhos relativos. Aqui o pedido segue tal e qual, sem retirar prefixo.
    location / {
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Sem a barra final o proxy_pass abaixo não encaixa.
    location = /multifuturo {
        return 302 /multifuturo/;
    }

    location /multifuturo/ {
        # A barra final é o que retira o prefixo antes de chegar à aplicação.
        proxy_pass http://app/;

        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
