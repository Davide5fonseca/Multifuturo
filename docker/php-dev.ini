; Ajustes de PHP para o ambiente de desenvolvimento (Docker/Sail no Windows).
;
; O Sail serve o site com "php artisan serve", ou seja, pelo SAPI de linha de
; comandos — onde o OPcache vem DESLIGADO por omissão. Como o projeto está no
; disco do Windows e é montado no container, cada pedido tinha de voltar a ler e
; compilar centenas de ficheiros PHP através dessa ponte (pedidos de 2 a 3
; segundos). Ligar o OPcache resolve o problema.
;
; validate_timestamps continua ligado: as alterações ao código aplicam-se de
; imediato, sem reiniciar o container.
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 10
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Cache dos caminhos já resolvidos — poupa muitas leituras ao disco montado.
realpath_cache_size = 8M
realpath_cache_ttl = 600
