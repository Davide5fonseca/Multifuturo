# Apache dentro do contentor: serve a aplicação (mod_php) e os estáticos.
# O HTTPS termina à frente — no Apache/painel do anfitrião (ver DEPLOY.md §10).

ServerTokens Prod
ServerSignature Off
Timeout 120

# mod_php: cada processo carrega o PHP (~40–60 MB). Dimensionado para um
# servidor pequeno (2 vCPU / 2–4 GB), a par do que o pool FPM anterior fazia.
<IfModule mpm_prefork_module>
    StartServers            3
    MinSpareServers         2
    MaxSpareServers         5
    MaxRequestWorkers       12
    MaxConnectionsPerChild  500
</IfModule>

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # O encaminhamento (front controller) vem do public/.htaccess do Laravel.
    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Ficheiros e pastas escondidos nunca são servidos.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    # Cabeçalhos de segurança (o HSTS é posto pelo proxy que faz o HTTPS).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always unset X-Powered-By

    # Compressão de texto.
    AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml

    # Estáticos com nome "hashed" (Vite) podem ficar em cache um ano.
    <LocationMatch "^/(build/|vendor/leaflet/|images/|favicon\.ico$|favicon\.svg$|apple-touch-icon\.png$)">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Fotografias carregadas: cache curta, mudam quando a agência as troca.
    <LocationMatch "^/storage/">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
