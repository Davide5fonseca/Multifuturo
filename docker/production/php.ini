; PHP em produção (Multifuturo Propriedades).
; Parte do php.ini-production oficial; aqui só o que muda.

; Erros ficam no log, nunca no ecrã.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

memory_limit = 256M
max_execution_time = 60

; Fotografias e documentos das fichas (várias imagens de uma vez).
upload_max_filesize = 32M
post_max_size = 64M
max_file_uploads = 40

; Fuso da agência; o Laravel usa APP_TIMEZONE, isto é para o resto.
date.timezone = Europe/Lisbon

; OPcache: o código não muda entre deploys, por isso não se valida a cada pedido.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessões vivem no Redis (SESSION_DRIVER); cookies só por HTTPS.
session.cookie_secure = 1
session.cookie_httponly = 1
