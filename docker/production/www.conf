; PHP-FPM: um pool dimensionado para um servidor pequeno (2 vCPU / 2–4 GB).
; Cada processo usa ~40–60 MB; 12 processos chegam para dezenas de visitantes
; em simultâneo e deixam memória para o PostgreSQL e o Redis.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Pedidos lentos (mais de 5 s) ficam registados com a pilha de chamadas.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; Logs para o Docker.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
