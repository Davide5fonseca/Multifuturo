services:
    multifuturo.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.3'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.3/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # A porta 80 do host pertence ao proxy: o site vive em /multifuturo.
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            # OPcache ligado no CLI: sem isto o "artisan serve" recompila tudo a cada pedido.
            - './docker/php-dev.ini:/etc/php/8.3/cli/conf.d/99-multifuturo.ini'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - mailpit
    # Processo das filas. Os avisos por email de cada pedido do site são
    # enviados em fila; sem isto ficam parados e nunca saem — em produção é
    # preciso um processo equivalente sempre a correr.
    queue:
        image: 'sail-8.3/app'
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600', '--sleep=1']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - './docker/php-dev.ini:/etc/php/8.3/cli/conf.d/99-multifuturo.ini'
        networks:
            - sail
        depends_on:
            - multifuturo.test
            - pgsql
            - redis
        restart: unless-stopped

    # Agendador. É o que faz a cópia de segurança diária acontecer; sem um
    # processo destes (ou um cron equivalente em produção), o agendamento do
    # Laravel nunca corre.
    scheduler:
        image: 'sail-8.3/app'
        command: ['php', 'artisan', 'schedule:work']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            - './docker/php-dev.ini:/etc/php/8.3/cli/conf.d/99-multifuturo.ini'
        networks:
            - sail
        depends_on:
            - multifuturo.test
            - pgsql
            - redis
        restart: unless-stopped

    # nginx à frente da aplicação, para servir o site em http://localhost/multifuturo.
    proxy:
        image: 'nginx:1.27-alpine'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
            - './docker/nginx/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro'
        networks:
            - sail
        depends_on:
            - multifuturo.test
    pgsql:
        image: 'postgres:16-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
